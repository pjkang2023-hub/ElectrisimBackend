[pytest]
testpaths = tests
pythonpath = . tests

# -p no:faulthandler: importing dss_python_backend raises a first-chance Windows
# exception (0xe0465043) in the native DLL loader. It is caught internally and
# OpenDSS works, but faulthandler prints a 20-line stack above every run and
# buries the results. Drop this flag if you are debugging a real native crash.
addopts = -q --tb=short -p no:faulthandler

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
